<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotoLinker — Employee Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d2e; --card: #222638; --border: #2e3250;
    --text: #e2e8f0; --muted: #8892a4; --primary: #6366f1; --primary-h: #4f46e5;
    --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #38bdf8;
    --sidebar-w: 210px; --topbar-h: 60px;
    --radius: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* ── Auth ── */
  .auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:400px; }
  .auth-logo { text-align:center; margin-bottom:28px; }
  .auth-logo-icon { width:52px; height:52px; background:var(--primary); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 12px; }
  .auth-logo h1 { font-size:20px; font-weight:700; }
  .auth-logo p  { font-size:13px; color:var(--muted); margin-top:4px; }
  .auth-err { background:rgba(239,68,68,.1); border:1px solid var(--danger); color:var(--danger); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }

  /* ── Layout ── */
  .layout { display:none; min-height:100vh; }

  /* Sidebar */
  .sidebar { position:fixed; top:0; left:0; width:var(--sidebar-w); height:100vh; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:100; }
  .sidebar-brand { padding:20px 18px 16px; border-bottom:1px solid var(--border); }
  .sidebar-brand-row { display:flex; align-items:center; gap:10px; }
  .sidebar-icon { width:34px; height:34px; background:var(--primary); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .sidebar-brand-name { font-size:13px; font-weight:700; line-height:1.2; }
  .sidebar-brand-sub  { font-size:10px; color:var(--muted); }
  .sidebar-nav { flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all .15s; border:none; background:none; width:100%; text-align:left; }
  .nav-item:hover { background:rgba(255,255,255,.05); color:var(--text); }
  .nav-item.active { background:rgba(99,102,241,.15); color:var(--primary); font-weight:600; }
  .nav-icon { font-size:16px; width:20px; text-align:center; }
  .sidebar-footer { padding:14px 18px; border-top:1px solid var(--border); }
  .user-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .user-avatar { width:32px; height:32px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
  .user-name { font-size:13px; font-weight:600; }
  .user-role { font-size:11px; color:var(--muted); }

  /* Content */
  .content { margin-left:var(--sidebar-w); min-height:100vh; }
  .topbar { height:var(--topbar-h); background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 28px; position:sticky; top:0; z-index:50; }
  .topbar-title { font-size:16px; font-weight:600; }
  .topbar-hours { display:flex; align-items:center; gap:8px; background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.25); border-radius:20px; padding:5px 14px; font-size:13px; font-weight:600; color:var(--primary); }

  /* Pages */
  .page { display:none; padding:28px; }
  .page.active { display:block; }
  .page-title { font-size:20px; font-weight:700; margin-bottom:24px; }

  /* Stats row */
  .stats-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
  .stat-box { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; flex:1; min-width:120px; }
  .stat-val { font-size:24px; font-weight:700; }
  .stat-lbl { font-size:11px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.04em; }

  /* Tabs */
  .tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:20px; }
  .tab { padding:10px 20px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--primary); border-bottom-color:var(--primary); }

  /* Card */
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
  .card-title { font-size:15px; font-weight:600; margin-bottom:18px; }

  /* Task list */
  .task-item { display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .task-item:last-child { border-bottom:none; }
  .task-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .task-dot.todo        { background:#94a3b8; }
  .task-dot.in_progress { background:var(--warning); }
  .task-dot.done        { background:var(--success); }
  .task-info { flex:1; }
  .task-name { font-size:14px; font-weight:500; margin-bottom:4px; }
  .task-name.done { text-decoration:line-through; color:var(--muted); }
  .task-meta { font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .task-badges { display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .badge-todo        { background:rgba(148,163,184,.12); color:#94a3b8; }
  .badge-in_progress { background:rgba(251,191,36,.12);  color:#fbbf24; }
  .badge-done        { background:rgba(34,197,94,.12);   color:#22c55e; }
  .badge-high   { background:rgba(239,68,68,.1);   color:var(--danger); }
  .badge-medium { background:rgba(251,191,36,.1);  color:var(--warning); }
  .badge-low    { background:rgba(34,197,94,.1);   color:var(--success); }
  .overdue-tag { font-size:10px; color:var(--danger); font-weight:600; }
  .complete-date { font-size:11px; color:var(--success); }

  /* Form */
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:600px) { .form-row { grid-template-columns:1fr; } }
  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .form-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .form-control { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px; font-size:14px; outline:none; transition:border .2s; width:100%; }
  .form-control:focus { border-color:var(--primary); }
  .form-hint { font-size:11px; color:var(--muted); }
  .task-toggle { display:flex; gap:6px; margin-bottom:6px; }
  .toggle-btn { flex:1; padding:7px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12px; cursor:pointer; text-align:center; transition:all .2s; }
  .toggle-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }

  /* Buttons */
  .btn { padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-h); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-sm { padding:5px 12px; font-size:12px; }

  /* Table */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:rgba(255,255,255,.04); padding:10px 14px; text-align:left; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); }
  td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:middle; }
  tr:hover td { background:rgba(255,255,255,.02); }

  .alert-success { background:rgba(34,197,94,.1); border:1px solid var(--success); color:var(--success); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; }
  .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
  .loading { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Auth ── -->
<div class="auth-wrap" id="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🏍</div>
      <h1>Employee Portal</h1>
      <p>MotoLinker · Log hours &amp; track tasks</p>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-control" id="login-user" placeholder="Your username" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" id="login-pass" type="password" placeholder="Your password"
        onkeydown="if(event.key==='Enter')submitLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" id="login-btn" onclick="submitLogin()">Sign In</button>
  </div>
</div>

<!-- ── Main Layout ── -->
<div class="layout" id="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-row">
        <div class="sidebar-icon">🏍</div>
        <div>
          <div class="sidebar-brand-name">MotoLinker</div>
          <div class="sidebar-brand-sub">Employee Portal</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" id="nav-log"   onclick="navigate('log')">
        <span class="nav-icon">⏱️</span> Log Hours
      </button>
      <button class="nav-item"        id="nav-tasks" onclick="navigate('tasks')">
        <span class="nav-icon">📋</span> My Tasks
      </button>
      <button class="nav-item"        id="nav-hours" onclick="navigate('hours')">
        <span class="nav-icon">📊</span> Hours Log
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>
          <div class="user-name" id="user-name">—</div>
          <div class="user-role">Employee</div>
        </div>
      </div>
      <button class="btn btn-outline" style="width:100%;font-size:12px;padding:7px" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Log Hours</div>
      <div class="topbar-hours" id="total-hours-badge" title="Your total logged hours">⏱️ 0.0h logged</div>
    </div>

    <!-- ── Log Hours Page ── -->
    <div class="page active" id="page-log">
      <div class="card">
        <div class="card-title">Log Your Hours</div>
        <div class="alert-success" id="log-success">✅ Hours logged successfully!</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date *</label>
            <input class="form-control" id="h-date" type="date">
          </div>
          <div class="form-group">
            <label class="form-label">Hours Worked *</label>
            <input class="form-control" id="h-hours" type="number" min="0.25" step="0.25" placeholder="e.g. 3.5">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Task</label>
          <div class="task-toggle">
            <div class="toggle-btn active" id="toggle-select" onclick="setTaskMode('select')">Select from list</div>
            <div class="toggle-btn"        id="toggle-type"   onclick="setTaskMode('type')">Type task name</div>
          </div>
          <div id="task-select-wrap">
            <select class="form-control" id="h-task-select">
              <option value="">— No specific task —</option>
            </select>
            <div class="form-hint">Can't find your task? Switch to "Type task name"</div>
          </div>
          <div id="task-type-wrap" style="display:none">
            <input class="form-control" id="h-task-text" placeholder="e.g. Fixed homepage banner issue">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes <span style="color:var(--muted);font-size:10px">(optional)</span></label>
          <input class="form-control" id="h-note" placeholder="What did you work on specifically?">
        </div>

        <button class="btn btn-primary" id="log-btn" onclick="logHours()">Log Hours</button>
      </div>
    </div>

    <!-- ── My Tasks Page ── -->
    <div class="page" id="page-tasks">
      <div id="tasks-stats" class="stats-row"></div>
      <div class="tabs">
        <div class="tab active" id="tab-current"   onclick="switchTab('current')">⏳ Current Tasks</div>
        <div class="tab"        id="tab-completed" onclick="switchTab('completed')">✅ Completed</div>
      </div>
      <div id="tasks-container"><div class="loading"><span class="spinner"></span>Loading…</div></div>
    </div>

    <!-- ── Hours Log Page ── -->
    <div class="page" id="page-hours">
      <div id="hours-stats" class="stats-row"></div>
      <div class="card" style="padding:0;overflow:hidden">
        <div id="hours-table-container"><div class="loading"><span class="spinner"></span>Loading…</div></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /layout -->

<script>
let empToken  = localStorage.getItem('ml_emp_token');
let empInfo   = null;
let taskMode  = 'select';
let myTasks   = [];
let myHours   = [];
let totalHrs  = 0;
let activeTab = 'current';

/* ── API helper ── */
async function ef(path, opts = {}) {
  const h = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (empToken) h['Authorization'] = 'Bearer ' + empToken;
  return fetch(path, { ...opts, headers: h });
}

/* ── Auth ── */
async function submitLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('auth-err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/employee/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('login-user').value.trim(), password: document.getElementById('login-pass').value }),
    });
    const d = await r.json();
    if (d.error) { err.textContent = d.error; err.style.display = 'block'; return; }
    empToken = d.token; empInfo = d;
    localStorage.setItem('ml_emp_token', empToken);
    showApp();
  } catch (e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function checkAuth() {
  if (!empToken) return showLogin();
  try {
    const r = await ef('/api/employee/check');
    if (!r.ok) { localStorage.removeItem('ml_emp_token'); empToken = null; return showLogin(); }
    empInfo = await r.json();
    showApp();
  } catch { showLogin(); }
}

function showLogin() {
  document.getElementById('auth-wrap').style.display = 'flex';
  document.getElementById('layout').style.display = 'none';
}

async function showApp() {
  document.getElementById('auth-wrap').style.display = 'none';
  document.getElementById('layout').style.display = 'flex';
  const name = empInfo?.name || empInfo?.username || '?';
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-avatar').textContent = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('h-date').value = new Date().toISOString().split('T')[0];
  await Promise.all([loadDropdownTasks(), loadMyTasks(), loadMyHours()]);
}

async function logout() {
  try { await ef('/api/employee/logout', { method: 'POST' }); } catch (_) {}
  localStorage.removeItem('ml_emp_token'); empToken = null; showLogin();
}

/* ── Navigation ── */
const pageTitles = { log: 'Log Hours', tasks: 'My Tasks', hours: 'Hours Log' };
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  document.getElementById('topbar-title').textContent = pageTitles[page];
}

/* ── Task mode toggle ── */
function setTaskMode(mode) {
  taskMode = mode;
  document.getElementById('toggle-select').classList.toggle('active', mode === 'select');
  document.getElementById('toggle-type').classList.toggle('active', mode === 'type');
  document.getElementById('task-select-wrap').style.display = mode === 'select' ? '' : 'none';
  document.getElementById('task-type-wrap').style.display   = mode === 'type'   ? '' : 'none';
}

/* ── Tab switch (My Tasks) ── */
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-current').classList.toggle('active', tab === 'current');
  document.getElementById('tab-completed').classList.toggle('active', tab === 'completed');
  renderTasksList();
}

/* ── Load dropdown tasks ── */
async function loadDropdownTasks() {
  try {
    const r = await ef('/api/employee/tasks');
    const tasks = await r.json();
    const sel = document.getElementById('h-task-select');
    sel.innerHTML = '<option value="">— No specific task —</option>' +
      tasks.map(t => `<option value="${t.id}">[${t.status.replace('_',' ')}] #${t.id} — ${t.title.substring(0,60)}${t.title.length>60?'…':''}</option>`).join('');
  } catch (e) { console.error('loadDropdownTasks:', e); }
}

/* ── Load My Tasks ── */
async function loadMyTasks() {
  document.getElementById('tasks-container').innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';
  try {
    const r = await ef('/api/employee/my-tasks');
    myTasks = await r.json();
    renderTasksStats();
    renderTasksList();
  } catch (e) {
    document.getElementById('tasks-container').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderTasksStats() {
  const current   = myTasks.filter(t => t.status !== 'done');
  const completed = myTasks.filter(t => t.status === 'done');
  const overdue   = current.filter(t => t.due_date < new Date().toISOString().split('T')[0]);
  document.getElementById('tasks-stats').innerHTML = `
    <div class="stat-box"><div class="stat-val" style="color:var(--info)">${myTasks.length}</div><div class="stat-lbl">Total Tasks</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--warning)">${current.length}</div><div class="stat-lbl">Active</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--success)">${completed.length}</div><div class="stat-lbl">Completed</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--danger)">${overdue.length}</div><div class="stat-lbl">Overdue</div></div>`;
}

function priorityEmoji(p) { return { high:'🔴', medium:'🟡', low:'🟢' }[p] || '⚪'; }

function renderTasksList() {
  const today = new Date().toISOString().split('T')[0];
  const list  = activeTab === 'current'
    ? myTasks.filter(t => t.status !== 'done')
    : myTasks.filter(t => t.status === 'done');

  const c = document.getElementById('tasks-container');
  if (!list.length) {
    c.innerHTML = `<div class="empty">${activeTab === 'current' ? '🎉 No active tasks — all caught up!' : 'No completed tasks yet.'}</div>`;
    return;
  }

  c.innerHTML = list.map(t => {
    const isOverdue = t.due_date < today && t.status !== 'done';
    const completedDate = t.completed_at
      ? `<span class="complete-date">✅ Completed ${new Date(t.completed_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>` : '';
    return `<div class="task-item">
      <div class="task-dot ${t.status}"></div>
      <div class="task-info">
        <div class="task-name${t.status==='done'?' done':''}">${t.title}</div>
        <div class="task-meta">
          <span>${t.channel_name}</span>
          <span>Due ${t.due_date}</span>
          ${isOverdue ? '<span class="overdue-tag">⚠ Overdue</span>' : ''}
          ${completedDate}
        </div>
        <div class="task-badges">
          <span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span>
          <span class="badge badge-${t.priority}">${priorityEmoji(t.priority)} ${t.priority}</span>
          ${t.milestone ? `<span class="badge" style="background:rgba(56,189,248,.1);color:var(--info)">🏁 ${t.milestone}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Log Hours ── */
async function logHours() {
  const btn  = document.getElementById('log-btn');
  const succ = document.getElementById('log-success');
  succ.style.display = 'none';
  const hours    = document.getElementById('h-hours').value;
  const date     = document.getElementById('h-date').value;
  const note     = document.getElementById('h-note').value.trim();
  const taskId   = taskMode === 'select' ? document.getElementById('h-task-select').value : '';
  const taskText = taskMode === 'type'   ? document.getElementById('h-task-text').value.trim() : '';

  if (!hours || parseFloat(hours) <= 0) { alert('Please enter valid hours'); return; }
  if (!date) { alert('Please select a date'); return; }
  if (taskMode === 'type' && !taskText) { alert('Please type a task name'); return; }

  btn.disabled = true; btn.textContent = 'Logging…';
  try {
    const body = { hours, log_date: date, description: note };
    if (taskId)   body.task_id          = parseInt(taskId);
    if (taskText) body.task_description = taskText;
    const r = await ef('/api/employee/hours', { method: 'POST', body: JSON.stringify(body) });
    const d = await r.json();
    if (d.error) { alert('Error: ' + d.error); return; }
    document.getElementById('h-hours').value = '';
    document.getElementById('h-note').value  = '';
    document.getElementById('h-task-text').value = '';
    document.getElementById('h-task-select').value = '';
    succ.style.display = 'block';
    setTimeout(() => { succ.style.display = 'none'; }, 4000);
    await loadMyHours(); // refresh hours log + badge
  } catch (e) { alert('Error: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Log Hours'; }
}

/* ── Load My Hours ── */
async function loadMyHours() {
  const c = document.getElementById('hours-table-container');
  try {
    const r = await ef('/api/employee/hours');
    myHours = await r.json();
    totalHrs = myHours.reduce((s, h) => s + parseFloat(h.hours || 0), 0);

    // Update persistent badge
    document.getElementById('total-hours-badge').textContent = `⏱️ ${totalHrs.toFixed(1)}h logged`;

    // Stats
    const today = new Date().toISOString().split('T')[0];
    const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
    const thisWeek = myHours.filter(h => (h.log_date||'') >= weekAgo).reduce((s,h) => s+parseFloat(h.hours||0), 0);
    document.getElementById('hours-stats').innerHTML = `
      <div class="stat-box"><div class="stat-val" style="color:var(--primary)">${totalHrs.toFixed(1)}h</div><div class="stat-lbl">Total Logged</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--info)">${myHours.length}</div><div class="stat-lbl">Entries</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--success)">${thisWeek.toFixed(1)}h</div><div class="stat-lbl">This Week</div></div>`;

    if (!myHours.length) { c.innerHTML = '<div class="empty">No hours logged yet.</div>'; return; }
    c.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Task</th><th>Hours</th><th>Notes</th></tr></thead>
      <tbody>${myHours.map(h => {
        const taskName = h.tasks?.title || h.task_description || '—';
        const channel  = h.tasks?.channel_name ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">${h.tasks.channel_name}</div>` : '';
        return `<tr>
          <td style="white-space:nowrap;color:var(--muted);font-size:12px">${h.log_date || new Date(h.logged_at).toLocaleDateString()}</td>
          <td><div>${taskName}</div>${channel}</td>
          <td><strong style="color:var(--primary)">${parseFloat(h.hours).toFixed(1)}h</strong></td>
          <td style="font-size:12px;color:var(--muted)">${h.description || '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } catch (e) { c.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

checkAuth();
</script>
